[tools]
go = "1.27.2"
protoc = "36.2"
docker-compose = "5.6.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.8"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.5.1"

[tasks.run]
description = "Start dependencies and run the Go server"
run = "docker-compose up -d --wait && go run ./cmd/server/main.go"

[tasks.db-changelog-sync]
description = "Baseline a database whose schema already matches Liquibase"
run = "docker-compose run --build --rm liquibase changelog-sync"

[tasks.db-status]
description = "Show Liquibase changesets pending for the local database"
run = "docker-compose run --build --rm liquibase status --verbose"

[tasks.db-migrate]
description = "Apply pending Liquibase database migrations"
run = "docker-compose run --build --rm liquibase update"

[tasks.reset]
description = "Stop containers and remove persistent volumes"
run = "docker-compose down -v"

[tasks.proto-gen]
description = "Generate Go code from one proto file"
usage = 'arg "<proto>" help="Path under proto/, e.g. exchange/create/exchange.proto"'
run = '''
protoc --go_out=pkg --go_opt=paths=source_relative \
  --go-grpc_out=pkg --go-grpc_opt=paths=source_relative \
  "proto/${usage_proto}"
'''

[tasks.proto-gen-all]
description = "Generate Go code from all proto files"
run = '''
find ./proto -name '*.proto' -print0 | xargs -0 -n 1 protoc \
  --go_out=pkg --go_opt=paths=source_relative \
  --go-grpc_out=pkg --go-grpc_opt=paths=source_relative
'''

[tasks.build]
description = "Build all Go packages"
run = "go build ./..."

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.fmt]
description = "Format all tracked Go files"
run = "gofmt -w $(git ls-files '*.go')"
