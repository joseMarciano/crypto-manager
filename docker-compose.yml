services:
    db_app:
        image: postgres:16.4
        container_name: db_app
        environment:
            POSTGRES_USER: local
            POSTGRES_PASSWORD: local
            POSTGRES_DB: crypto_app
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U local -d crypto_app"]
            interval: 2s
            timeout: 3s
            retries: 10
            start_period: 5s

    liquibase:
        image: crypto-manager-liquibase:5.0.4
        build:
            context: .
            dockerfile: docker/liquibase.Dockerfile
        profiles:
            - tools
        depends_on:
            db_app:
                condition: service_healthy
        volumes:
            - ./db/changelog:/liquibase/changelog:ro
        environment:
            LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
            LIQUIBASE_COMMAND_URL: jdbc:postgresql://db_app:5432/crypto_app
            LIQUIBASE_COMMAND_USERNAME: local
            LIQUIBASE_COMMAND_PASSWORD: local

    nats:
        image: nats:2.12.3-alpine3.22
        container_name: nats
        ports:
            - "4222:4222"
            - "8222:8222"
            - "6222:6222"
        command:
            - "-js"
